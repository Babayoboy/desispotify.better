<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiSpotify</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="logo-container">
                <i class="fas fa-music logo-icon"></i>
                <span class="logo-text">DesiSpotify</span>
            </div>

            <nav class="nav-menu">
                <div class="nav-item active">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </div>
                <div class="nav-item">
                    <i class="fas fa-search"></i>
                    <span>Search</span>
                </div>
                <!-- <div class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Your Library</span>
                </div> -->
            </nav>

            <div class="playlist-section">
                <div class="section-title">PLAYLISTS</div>
                <ul class="playlist-nav" id="albumList">
                    <!-- Albums will be populated here -->
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-scroll">
                <!-- Home View -->
                <div id="homeView">
                    <!-- Hero Section for currently selected Album/Artist -->
                    <div class="hero-section" id="heroSection">
                        <div class="hero-art">
                            <img id="heroImage" src="https://odfrnryfhkqqiedvqaco.supabase.co/storage/v1/object/public/images/desispotify.png" alt="Title">
                        </div>
                        <div class="hero-info">
                            <span class="hero-type">PLAYLIST</span>
                            <h1 id="heroTitle">All Tracks</h1>
                            <p id="heroDescription">Your daily mix of the best Desi beats.</p>
                            <div class="hero-stats">
                                <span id="heroCount"></span> • <span id="heroDuration"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Bar -->
                    <div class="action-bar">
                        <button class="play-btn-large" id="mainPlayBtn">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="action-icon"><i class="far fa-heart"></i></button>
                        <button class="action-icon"><i class="fas fa-ellipsis-h"></i></button>
                    </div>
                </div>

                <!-- Search View -->
                <div id="searchView" class="hidden">
                    <div class="search-container">
                        <div class="search-input-wrapper">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="What do you want to listen to?">
                        </div>
                    </div>
                </div>

                <!-- Library View (Mobile only concept) -->
                <div id="libraryView" class="hidden">
                    <div class="library-header">
                        <h2>Your Library</h2>
                    </div>
                    <ul class="library-list" id="mobileLibraryList">
                        <!-- Populated by JS -->
                    </ul>
                </div>

                <!-- Shared Song List (Visible on Home and Search) -->
                <div id="songListView">
                    <div class="song-list-header">
                        <div class="col-num">#</div>
                        <div class="col-title">Title</div>
                        <div class="col-album">Album</div>
                        <div class="col-duration"><i class="far fa-clock"></i></div>
                    </div>

                    <div class="song-list" id="playlist">
                        <!-- Songs will be populated here -->
                    </div>
                </div>

                <!-- Footer Info -->
                <div class="footer-info">
                    <p>© 2025 DesiSpotify. Built for the vibe.</p>
                    <p>Orignal idea by ktsec is a fork of <a href="https://gamingtech568.github.io/desispotify/"> desispotify</a></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav glass">
        <div class="mobile-nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="mobile-nav-item">
            <i class="fas fa-search"></i>
            <span>Search</span>
        </div>
        <div class="mobile-nav-item">
            <i class="fas fa-book"></i>
            <span>Library</span>
        </div>
    </nav>

    <!-- Player Bar -->
    <div class="player-bar glass">
        <div class="player-track-info">
            <img src="https://odfrnryfhkqqiedvqaco.supabase.co/storage/v1/object/public/images/desispotify.png" id="currentArt" alt="Art">
            <div class="track-details">
                <div class="track-name" id="trackTitle">Nothing Playing</div>
                <div class="track-artist" id="trackArtist">Select a song</div>
            </div>
            <button class="like-btn"><i class="far fa-heart"></i></button>
        </div>

        <div class="player-controls-center">
            <div class="control-buttons">
                <button class="control-icon" id="shuffleBtn"><i class="fas fa-random"></i></button>
                <button class="control-icon" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="control-icon play-pause-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-icon" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                <button class="control-icon" id="repeatBtn"><i class="fas fa-redo"></i></button>
            </div>
            <div class="progress-bar-container">
                <span class="time" id="currentTime">0:00</span>
                <div class="progress-bar-bg" id="progressBar">
                    <div class="progress-bar-fill" id="progress"></div>
                </div>
                <span class="time" id="totalTime">0:00</span>
            </div>
        </div>

        <div class="player-volume-right">
            <i class="fas fa-volume-up" id="volumeIcon"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="script.js"></script>
</body>

</html>
